<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#090704">
  <meta name="description" content="VEDA: India's great stories, the Ramayana and the Mahabharata, told page by page in many languages.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>VEDA</title>
  <link rel="icon" href="icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="fonts/fonts.css">
  <link rel="stylesheet" href="styles.css?v=veda1">
</head>
<body>
  <div class="splash" id="splash" aria-hidden="true">
    <img class="splash-art" src="veda.jpg" alt="">
    <p class="splash-name">VEDA</p>
    <p class="splash-tag">India's great stories</p>
  </div>
  <div class="wash" id="wash"></div>
  <div class="app">
    <div class="device" id="device">
      <header class="top">
        <button class="brand" id="brand" type="button" aria-label="Open all stories">
          <span class="dev" id="brand-mark">रामायण</span>
          <span class="en" id="book-label">Bala Kanda</span>
          <span class="kfrac" id="kanda-frac"></span>
        </button>
        <div class="top-tools" id="top-tools">
          <div class="count" id="count">1</div>
        </div>
      </header>
      <div class="progress" id="progress" role="progressbar" aria-valuemin="1" aria-valuemax="1" aria-valuenow="1" aria-label="Bala Kanda"><span id="bar"></span></div>
      <main class="feed" id="feed" aria-label="Ramayana stories"></main>
      <div class="hint" id="hint"><span>Swipe up</span><i></i></div>
      <aside class="rail">
        <button class="rail-btn desk-only" id="prev" type="button" aria-label="Previous story" title="Previous">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 14l6-6 6 6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button class="rail-btn" id="listen" type="button" aria-label="Listen" aria-pressed="false" title="Listen">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M4.5 9.5v5h3.2L12 18.2V5.8L7.7 9.5H4.5z" fill="currentColor"/>
            <path class="wave" d="M15.2 9.2a3.6 3.6 0 0 1 0 5.6" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
            <path class="wave" d="M17.6 6.8a7 7 0 0 1 0 10.4" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
          <span class="cap" id="listen-cap">Listen</span>
        </button>
        <button class="rail-btn" id="theatre-btn" type="button" aria-label="Theatre mode" title="Theatre mode">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="5.5" width="17" height="13" rx="2.2" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M10.2 9.4v5.2l4.4-2.6z" fill="currentColor"/></svg>
          <span class="cap" id="theatre-cap">Theatre</span>
        </button>
        <button class="rail-btn" id="like" type="button" aria-label="Save this story" aria-pressed="false" title="Save">
          <svg class="heart-line" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.2-4.6-7.2-9.2A4.1 4.1 0 0 1 12 8.2a4.1 4.1 0 0 1 7.2 3.1c0 4.6-7.2 9.2-7.2 9.2z" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>
          <svg class="heart-fill" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 20.5s-7.2-4.6-7.2-9.2A4.1 4.1 0 0 1 12 8.2a4.1 4.1 0 0 1 7.2 3.1c0 4.6-7.2 9.2-7.2 9.2z" fill="currentColor"/></svg>
          <span class="cap" id="like-cap">Save</span>
        </button>
        <button class="rail-btn" id="open-index" type="button" aria-label="All stories" title="All stories">
          <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h10" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <span class="cap" id="index-cap">Index</span>
        </button>
        <button class="rail-btn" id="share" type="button" aria-label="Share this story" title="Share">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="6" cy="12" r="2.1" fill="currentColor"/><circle cx="17" cy="7" r="2.1" fill="currentColor"/><circle cx="17" cy="17" r="2.1" fill="currentColor"/><path d="M8 11.2 15 8.2M8 12.8 15 15.8" stroke="currentColor" stroke-width="1.6"/></svg>
          <span class="cap" id="share-cap">Share</span>
        </button>
        <button class="rail-btn desk-only" id="next" type="button" aria-label="Next story" title="Next">
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 10l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
      </aside>
      <div class="player" id="player" hidden>
        <button class="player-btn" id="player-pause" type="button">Pause</button>
        <div class="speeds" id="speeds" role="group" aria-label="Playback speed">
          <button type="button" data-rate="0.75">0.75×</button>
          <button type="button" data-rate="1" class="on" aria-pressed="true">1×</button>
          <button type="button" data-rate="1.25">1.25×</button>
          <button type="button" data-rate="1.5">1.5×</button>
        </div>
        <span class="player-time" id="player-time">0:00</span>
      </div>
      <div class="gate" id="gate" hidden>
        <p class="kicker" id="gate-kicker"></p>
        <h2 id="gate-title"></h2>
        <p id="gate-body"></p>
        <button class="gate-go" id="gate-go" type="button"></button>
      </div>
      <div class="gate" id="done" hidden>
        <p class="kicker" id="done-kicker"></p>
        <h2 id="done-title"></h2>
        <p id="done-body"></p>
        <button class="gate-go" id="done-close" type="button"></button>
      </div>
      <div class="library" id="library">
        <div class="library-head">
          <div class="lib-titles">
            <p class="lib-brand">VEDA</p>
            <h2 id="library-title">Choose a story</h2>
          </div>
          <div class="head-actions" id="library-tools">
            <button type="button" class="lang-btn kids-btn" id="kids-btn" aria-pressed="false">Kids</button>
            <div class="lang" id="lang">
              <button type="button" class="lang-btn" id="lang-btn" aria-haspopup="listbox" aria-expanded="false">EN</button>
              <div class="lang-menu" id="lang-menu" hidden role="listbox"></div>
            </div>
            <button class="icon-btn" id="library-close" type="button" aria-label="Close" hidden>×</button>
          </div>
        </div>
        <div class="library-list" id="library-list"></div>
      </div>
      <div class="theatre" id="theatre" hidden role="dialog" aria-modal="true" aria-label="Theatre mode">
        <div class="t-stage" id="t-stage">
          <div class="t-shot"><img class="t-bg" alt="" draggable="false"><img class="t-img" alt="" draggable="false"></div>
          <div class="t-shot"><img class="t-bg" alt="" draggable="false"><img class="t-img" alt="" draggable="false"></div>
        </div>
        <div class="t-shade" aria-hidden="true"></div>
        <div class="t-card" id="t-card" hidden>
          <p class="t-kicker" id="t-kicker"></p>
          <h2 class="t-title" id="t-title"></h2>
          <p class="t-hook" id="t-hook"></p>
        </div>
        <div class="t-chapter" id="t-chapter" hidden>
          <span class="t-chapter-dev" id="t-chapter-dev"></span>
          <strong id="t-chapter-name"></strong>
        </div>
        <p class="t-sub" id="t-sub"><span id="t-sub-text"></span></p>
        <div class="t-controls">
          <div class="t-top">
            <button class="t-btn" id="t-exit" type="button" aria-label="Exit theatre">
              <svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <div class="t-where"><span id="t-where-k"></span><span id="t-where-n"></span></div>
            <button class="t-btn t-pill" id="t-cc" type="button" aria-pressed="true" aria-label="Subtitles">CC</button>
            <button class="t-btn" id="t-fit" type="button" aria-label="Show whole image">
              <svg class="i-fit" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 4H4v5M15 4h5v5M9 20H4v-5M15 20h5v-5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <svg class="i-fill" width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h5V4M20 9h-5V4M4 15h5v5M20 15h-5v5" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="t-mid">
            <button class="t-btn t-big" id="t-prev" type="button" aria-label="Previous page">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 5v14M19 5.5 9.5 12 19 18.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
            <button class="t-btn t-huge" id="t-play" type="button" aria-label="Pause" aria-pressed="true">
              <svg class="i-pause" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><rect x="6.5" y="5" width="3.6" height="14" rx="1" fill="currentColor"/><rect x="13.9" y="5" width="3.6" height="14" rx="1" fill="currentColor"/></svg>
              <svg class="i-play" width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5.2v13.6L19 12z" fill="currentColor"/></svg>
            </button>
            <button class="t-btn t-big" id="t-next" type="button" aria-label="Next page">
              <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M17 5v14M5 5.5 14.5 12 5 18.5z" fill="currentColor" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round"/></svg>
            </button>
          </div>
          <div class="t-bottom">
            <div class="t-progress"><span id="t-bar"></span></div>
            <button class="t-btn t-pill" id="t-speed" type="button" aria-label="Speed">1&times;</button>
          </div>
        </div>
        <p class="t-tip" id="t-tip" aria-hidden="true"></p>
      </div>
      <div class="pop" id="pop" hidden role="dialog" aria-modal="true" aria-labelledby="pop-title">
        <div class="pop-card">
          <button class="pop-x" id="pop-close" type="button" aria-label="Close">&times;</button>
          <div class="pop-body" id="pop-body"></div>
        </div>
      </div>

      <div class="pop" id="quiz" hidden role="dialog" aria-modal="true" aria-labelledby="quiz-title">
        <div class="pop-card">
          <button class="pop-x" id="quiz-close" type="button" aria-label="Close">&times;</button>
          <div class="pop-body" id="quiz-body"></div>
        </div>
      </div>

      <div class="toast" id="toast" role="status"></div>
      <p class="sr" id="live" aria-live="polite"></p>
    </div>
      <p class="keys" id="keys">↑ ↓ move · L save · I index</p>
  </div>

  <div class="sheet" id="sheet" hidden>
    <div class="panel" role="dialog" aria-modal="true" aria-labelledby="sheet-title">
      <div class="handle"></div>
      <div class="panel-head">
        <div>
          <h3 id="sheet-title">The Ramayana</h3>
          <p id="read-stat"></p>
        </div>
        <button class="icon-btn" id="close-sheet" type="button" aria-label="Close">×</button>
      </div>
      <input class="search" id="search" type="search" placeholder="Search the book" autocomplete="off" aria-label="Search the book">
      <div class="chips" id="chips"></div>
      <div class="list" id="list"></div>
      <p class="sheet-note">
        <span id="note-text">Valmiki's Ramayana, from the krauncha to the Sarayu.</span>
        <button class="texty" id="start-over" type="button">Begin again</button>
      </p>
    </div>
  </div>

  <script src="capacitor.js"></script>
  <script src="native.js?v=veda1"></script>
  <script src="narrator.js?v=veda1"></script>
  <script src="chapters.js"></script>
  <script src="pages-a.js"></script>
  <script src="pages-b.js"></script>
  <script src="pages-c.js?v=reel8"></script>
  <script src="stories.js"></script>
  <script src="catalog.js?v=veda1"></script>
  <script src="books.js?v=shelf3"></script>
  <script src="focus.js?v=reel12"></script>
  <script src="i18n.js?v=veda1"></script>
  <!-- translations:start -->
  <script src="translations/gu.js"></script>
  <script src="translations/te.js"></script>
  <!-- translations:end -->
  <script src="glossary.js?v=veda1"></script>
  <script src="extras.js?v=veda1"></script>
  <script src="depth.js?v=veda1"></script>
  <script src="app.js?v=veda1"></script>
  <script src="shots.js?v=veda1"></script>
  <script src="theatre.js?v=veda1"></script>
  <script src="quiz-data.js?v=veda1"></script>
  <script src="learn.js?v=veda1"></script>
</body>
</html>
